const SRC_BOOK = "Revolutionary Berlin: A Walking Guide, de Nathaniel Flakin (Pluto Press, 2022)";
const BOOK = {
  eden:{ ref:"paragem 3.11, pp. 83 e 94–96", html:`<p>Em janeiro de 1919 o luxuoso Hotel Eden, aqui em frente, era o quartel-general da Divisão de Fuzileiros da Cavalaria da Guarda, sob o comando do capitão Waldemar Pabst. Foi para aqui que levaram Karl Liebknecht e Rosa Luxemburg depois de serem presos, na noite de 15 de janeiro.</p><p>Segundo o relato que o próprio Pabst deixou mais tarde, ele telefonou para a Chancelaria e falou com o ministro da Guerra, Gustav Noske, que lhe devolveu a decisão. Os militares montaram então um plano para matar sem que ninguém assumisse a responsabilidade.</p><p>Liebknecht foi metido num carro, supostamente a caminho da prisão de Moabit. No Tiergarten o motorista fingiu uma avaria e Liebknecht foi morto a tiro pelas costas, "em tentativa de fuga". O autor nota que esta fórmula passou a ser usada muitas vezes nos anos seguintes para matar revolucionários.</p>` },
  rosa:{ ref:"paragem 3.12, pp. 96–97", html:`<p>Rosa Luxemburg saiu do hotel separadamente. À porta, um soldado agrediu-a com a coronha da espingarda, e já no carro outro soldado deu-lhe um tiro na cabeça. O corpo foi atirado desta ponte para o Landwehrkanal. Os assassinos disseram que uma multidão a tinha levado.</p><p>O corpo só foi encontrado a 31 de maio de 1919. Um tribunal militar da mesma divisão deu uma pena leve a um soldado por "tentativa" de homicídio, e um dos oficiais ajudou-o depois a fugir do país. Pabst nunca foi acusado e fez carreira sob os nazis e, mais tarde, na Alemanha Ocidental.</p><p>O autor defende que os dirigentes sociais-democratas da altura, Noske e Ebert, têm responsabilidade política no crime, que o SPD nunca reconheceu. Hoje a ponte está dividida em duas passagens: uma liga as duas partes do Zoo, a outra pertence ao Tiergarten.</p>` },
  liebknecht:{ ref:"paragens 3.12 (p. 97), 2.4 (p. 46) e 2.6 (p. 52)", html:`<p>Uns 200 metros a norte da ponte, à beira do Neuer See, uma coluna de tijolo marca o sítio onde Liebknecht foi morto na noite de 15 de janeiro de 1919.</p><p>Liebknecht tinha sido o primeiro deputado a votar contra os créditos de guerra, em dezembro de 1914. A 9 de novembro de 1918 proclamou a "República Socialista Livre" a partir do Portal IV do Palácio Real.</p>` },
  hirschfeld:{ ref:"paragem 8.2, pp. 217–220", html:`<p>Junto ao Spree, ao lado da antiga Sala de Congressos (hoje Haus der Kulturen der Welt), uma caixa de metal castanha assinala o Instituto de Ciência Sexual de Magnus Hirschfeld. A vivenda ficava, na verdade, do outro lado do edifício.</p><p>Hirschfeld tinha dirigido o Comité Científico-Humanitário, a primeira organização do mundo a defender os direitos de homossexuais e pessoas trans. Abriu o instituto em 1919, com consultas médicas, palestras e um enorme arquivo. Ali foi feita uma das primeiras cirurgias de afirmação de género, à mulher trans Dora Richter, e passaram pensadores como Walter Benjamin e Ernst Bloch.</p><p>A 6 de maio de 1933, estudantes nazis invadiram o instituto e as SA levaram os livros. Muitos arderam quatro dias depois, na queima de livros da Bebelplatz (paragem de sábado). Hirschfeld estava no estrangeiro, nunca voltou e morreu em França em 1935.</p>` },
  reichstag:{ ref:"paragens 2.3 (pp. 44–46), 2.4 (p. 46) e 2.6 (p. 52)", html:`<p>Para o autor, o edifício traduz o compromisso desconfortável do império de 1871: uma monarquia autoritária com um parlamento sem grande poder. A cúpula de vidro de Norman Foster (1999) é, para ele, decoração moderna sobre uma estrutura herdada dos Kaisers.</p><p>Ironia: durante décadas foi o centro do movimento revolucionário. Com as leis antissocialistas (1878–1890), o SPD estava proibido, mas os deputados eleitos como independentes tinham imunidade e podiam falar abertamente no plenário. Em 1912 o SPD era o maior partido da Alemanha.</p><p>A 4 de agosto de 1914 o grupo parlamentar do SPD votou a favor dos créditos de guerra, o que chocou os trabalhadores. Em dezembro, Liebknecht foi o primeiro a votar contra. A 9 de novembro de 1918, Philipp Scheidemann proclamou a república a partir de uma janela do Reichstag, horas antes de Liebknecht proclamar a república socialista no palácio.</p>` },
  gate:{ ref:"paragem 1.1, pp. 7–10", html:`<p>É aqui que começa o primeiro passeio do livro, dedicado ao colonialismo alemão. A Alemanha entrou tarde na corrida colonial, mas com violência: a partir da década de 1880 conquistou territórios em África, na Ásia e no Pacífico, e em poucas décadas provocou centenas de milhares de mortos, incluindo o primeiro genocídio alemão.</p><p>A história é mais antiga do que o próprio país. Em 1683, um aristocrata de Brandemburgo, Friedrich Otto von der Groeben, fundou o forte de Groß Friedrichsburg, na atual Gana, que se tornou um centro do tráfico de escravos. Em 1717 o rei vendeu-o aos holandeses, num pagamento que incluía 7200 ducados e doze africanos.</p><p>Com Bismarck, depois de 1871, o Império ficou com quatro colónias em África: Togo, Camarões, Sudoeste Africano (a atual Namíbia) e África Oriental Alemã.</p>` },
  w92:{ ref:"paragem 1.2, pp. 11–13", html:`<p>Hoje só se veem prédios da RDA, e é preciso imaginação para ver ali um palácio com jardim atrás de grades de ferro. Era a Chancelaria do Reich de Otto von Bismarck, o centro do poder do Império Alemão.</p><p>Foi aqui que Bismarck reuniu catorze potências coloniais entre novembro de 1884 e fevereiro de 1885. Na Conferência de Berlim, sem um único africano presente, foram traçadas fronteiras em África que em grande parte ainda existem. A questão principal era a bacia do Congo, que ficou propriedade pessoal do rei Leopoldo II da Bélgica. O autor sublinha que, em duas décadas, a administração belga causou até 10 milhões de mortos.</p><p>No fim da conferência, só restavam alguns Estados africanos independentes. Há uma placa no passeio desde 2004, nos 120 anos da conferência.</p>` },
  wilhelm:{ ref:"paragens 1.3 (pp. 13–14) e 1.7 (pp. 21–22)", html:`<h4>Unter den Linden 71 · Ministério da Educação da RDA</h4><p>O edifício duplo em frente à embaixada britânica foi o Ministério da Educação Popular da RDA. A ministra mais duradoura foi Margot Honecker (1963–89). Em 2005 foi convidada de honra na Namíbia, em reconhecimento do apoio da RDA ao movimento de independência SWAPO. O autor, crítico da RDA, vê nisso um exemplo de anticolonialismo concreto.</p><h4>Wilhelmstraße 51 (aprox.) · Ministério Colonial</h4><p>Em frente, onde está hoje uma escola, funcionou o Ministério Colonial do Império (1907–1920). Desde 2019 uma placa junto ao centro juvenil Ikarus lembra Martin Dibobe, que veio para Berlim para ser "exibido" na Exposição Colonial de 1896, se tornou maquinista do metro e, em 1919, entregou uma petição com 32 reivindicações de igualdade.</p>` },
  stelae:{ ref:"paragem 8.2, p. 220", html:`<p>O livro não dedica uma paragem própria ao Memorial aos Judeus Assassinados da Europa, mas é a passagem natural da Wilhelmstraße para o Tiergarten.</p><p>Do outro lado da Ebertstraße, mesmo em frente, fica o Memorial aos Homossexuais Perseguidos pelo Nazismo, inaugurado em 2008: um bloco de betão com um vídeo em repetição, a menos de dois quilómetros de onde ficava o instituto de Hirschfeld. O autor lembra que o memorial foi polémico na comunidade queer, por causa da questão de incluir ou não as lésbicas.</p>` },
  lenne:{ ref:"paragem 6.4, p. 165", html:`<p>Este triângulo, hoje com prédios novos e o pequeno Henriette-Herz-Park, era território de Berlim Leste que ficava do lado ocidental do Muro. A polícia de Berlim Ocidental não podia entrar.</p><p>Em maio de 1988, punks e ativistas de esquerda ocuparam-no, com 200 a 300 pessoas, e chamaram-lhe "Kubatstan", em memória de Norbert Kubat, um ativista que se tinha suicidado na prisão. A polícia cercou o terreno e lançou gás lacrimogéneo lá para dentro.</p><p>A 1 de julho de 1988 o terreno passou para o Ocidente e a polícia avançou. Muitos ocupantes fugiram por cima do Muro para Leste, por escadas que os guardas da RDA lhes baixaram. Deram-lhes almoço e mandaram-nos de volta para o Ocidente de S-Bahn.</p>` },
  potsdamer:{ ref:"paragem 2.1, pp. 37–40", html:`<p>Para o autor, o centro comercial de hoje esconde o sítio onde começou a revolução mais importante da história de Berlim. A 1 de maio de 1916, em plena guerra, uns milhares de trabalhadores responderam a um apelo anónimo. Karl Liebknecht, com farda de soldado, gritou contra a guerra e contra o governo, e foi preso.</p><p>No dia do julgamento, a 28 de junho, 50 000 metalúrgicos fizeram greve: foi a primeira ação de massas contra a guerra, organizada pelos Delegados Revolucionários de Richard Müller. Liebknecht foi condenado a quatro anos de prisão.</p><p>O pedestal de pedra sem estátua foi posto pela RDA em 1951, no 80.º aniversário de Liebknecht. A estátua nunca chegou, e em 1961 o Muro deixou o pedestal na faixa da morte. Foi retirado em 1995 e voltou ao lugar em 2002. O autor lê-o como um monumento que diz que Liebknecht já não está cá, e que só continua vivo nas ações de quem vem depois.</p>` },
  chancelaria:{ ref:"paragem 1.4, pp. 14–16", html:`<p>Neste quarteirão estreito, em frente a uma entrada do Mall of Berlin, ficava a Nova Chancelaria de Hitler, desenhada por Albert Speer e inaugurada em 1939. Por baixo estava o bunker onde Hitler se suicidou em 1945. Não há nada para ver, e é esse o ponto.</p><p>A Wilhelmplatz, onde as multidões o ouviam, desapareceu: o lado norte encheu-se de prédios da RDA nos anos 80 e no lado sul foi construída a embaixada da Checoslováquia (1978), que o autor elogia. Atrás fica a embaixada da Coreia do Norte.</p><p>A RDA mudou o nome da praça para Thälmannplatz (1949) e o da Wilhelmstraße para Otto-Grotewohl-Straße (1964). Os nomes antigos voltaram em 1992 e 1993. A conclusão do autor é irónica: mudar nomes de ruas afinal é fácil, desde que seja para tirar os comunistas.</p>` },
  amo:{ ref:"paragem 1.5, pp. 16–19", extra:'A mudança de nome de 2025 não está no livro: <a href="https://www.berlin.de/ba-mitte/aktuelles/mitte-blog/2025/artikel.1590948.php" target="_blank" rel="noopener">Bezirksamt Mitte</a>.', html:`<p>Durante décadas, esta foi a rua com o nome mais ofensivo de Berlim: Mohrenstraße, "rua dos Mouros". A explicação mais comum liga o nome aos africanos entregues ao rei da Prússia na venda do forte de Groß Friedrichsburg, em 1717, mas há outras hipóteses.</p><p>Ativistas pediram a mudança durante anos. Em 2009, um coelho cor-de-rosa gigante acrescentou dois pontos às placas: Möhrenstraße, "rua das Cenouras". A estação de metro nem sequer tinha o nome antigo: chamou-se Kaiserhof (1908), Thälmannplatz e Otto-Grotewohl-Straße, e só passou a Mohrenstraße em 1991.</p><p>Em agosto de 2020 a junta de Mitte decidiu dar à rua o nome de Anton Wilhelm Amo, um filósofo negro do século XVIII que viveu na Prússia. Quando o livro saiu, a mudança ainda não tinha acontecido. Concretizou-se a 23 de agosto de 2025, depois de anos de processos em tribunal, e a estação do U2 também mudou de nome.</p>` }
};
BOOK.w48 = { ref:"paragem 1.6, p. 20", html:`<p>Na antiga Wilhelmstraße 48, hoje um parque de estacionamento em frente ao Ministério das Finanças, ficava a Neuer Deutscher Verlag, a editora de Willi Münzenberg. Münzenberg, o "milionário vermelho", dirigia um império de imprensa comunista na República de Weimar capaz de competir com os grandes grupos capitalistas.</p><p>Era aqui que se publicava a <em>Arbeiter-Illustrierte Zeitung</em> (Revista Ilustrada dos Trabalhadores), com reportagens fotográficas da Rússia soviética e as fotomontagens de John Heartfield. Münzenberg foi também o motor das organizações da Internacional Comunista que juntavam comunistas e não comunistas pela independência das colónias, como as da paragem seguinte.</p>` };
BOOK.bessel = { ref:"paragem 1.6, pp. 19–21", html:`<p>Nos anos 1920, um edifício na Friedrichstraße 24 foi a sede internacional da Liga contra o Imperialismo. Em setembro de 1929, cerca de 30 berlinenses negros, a maioria dos Camarões, antiga colónia alemã, reuniram-se aqui para fundar a secção alemã da Liga para a Defesa da Raça Negra.</p><p>O mais conhecido era o ator afro-alemão Louis Brody, que entrou em dezenas de filmes. A Liga montou uma revista teatral e chegou a planear um Teatro Negro, mas, sem dinheiro, dissolveu-se em 1932. Brody continuou a trabalhar sob os nazis, que precisavam de atores negros para os seus filmes de propaganda colonial.</p><p>As duas ligas eram organizadas pela Internacional Comunista. A Liga contra o Imperialismo nasceu num congresso em Bruxelas, em 1927, que juntou líderes anticoloniais e intelectuais europeus, de Nehru a Einstein. A diáspora africana em Berlim era então de cerca de 5000 pessoas, e por aqui passou também George Padmore, mais tarde conselheiro de Kwame Nkrumah no Gana independente.</p><p>Hoje o Besselpark é um relvado discreto ao lado da nova sede do jornal taz.</p>` };
BOOK.sieg = { ref:"paragens 6.3 (p. 162) e 7.4 (p. 192)", extra:'O contexto histórico não vem do livro: <a href="https://de.wikipedia.org/wiki/Siegess%C3%A4ule_(Berlin)" target="_blank" rel="noopener">Wikipédia (Siegessäule)</a>.', html:`<h4>Contexto</h4><p>A coluna foi erguida entre 1864 e 1873 para celebrar as vitórias da Prússia contra a Dinamarca, a Áustria e a França, as guerras que levaram à fundação do Império Alemão em 1871. No topo está a Vitória dourada, a que os berlinenses chamam «Goldelse».</p><p>Originalmente ficava na Königsplatz, em frente ao Reichstag. Em 1938–39 os nazis mudaram-na para aqui, para a Grande Estrela, e acrescentaram-lhe um andar, como parte do eixo monumental que Speer planeava para a capital «Germania».</p><h4>No livro</h4><p>O livro lembra que foi depois da vitória sobre a França e da fundação do Império, em 1871, que o colonialismo alemão ressurgiu (ver as Portas de Brandemburgo). A coluna aparece num episódio recente: em 2005, os moradores do projeto habitacional Yorck59, em Kreuzberg, ameaçados de despejo, ocuparam-na em protesto, tal como ocuparam as sedes do SPD e do PDS.</p><p>O livro refere ainda as estátuas dos reis prussianos que ladeavam a antiga Avenida da Vitória (Siegesallee), que atravessava o Tiergarten a partir da Königsplatz. Hoje estão expostas na Cidadela de Spandau, ao lado da cabeça da estátua de Lenine.</p>` };
function bookBlock(key){
  const b = BOOK[key]; if(!b) return "";
  return `<details class="more"><summary><span class="ico">★</span>Importância</summary><div class="txt">${b.html}<p class="src">Fonte: <em>${SRC_BOOK}</em>, ${b.ref} (paginação da edição impressa).${b.extra?" "+b.extra:""}</p></div></details>`;
}

    {t:"17:40", loc:[["Memorial aos Homossexuais: Ebertstraße, 10785 Berlin",52.5132624,13.3761485],["Memorial do Holocausto: Cora-Berliner-Straße 1, 10117 Berlin",52.5139474,13.3787126]], art:"stelae", img:"img/stelae.jpg", ar:"900/500", ph:"night", book:"stelae", name:"Memorial aos Homossexuais Perseguidos e Memorial do Holocausto", note:"Primeiro o bloco de betão com o vídeo, do lado do Tiergarten da Ebertstraße. Depois atravessem a rua e cruzem os blocos do Memorial do Holocausto de oeste para leste, em direção à Wilhelmstraße.", route:dir(BT,"Holocaust-Mahnmal Berlin","walking",[HOMO]), rl:"A pé · 8 min", photo:HOMO},
    {t:"18:00", loc:[["Wilhelmstraße 51, 10117 Berlin",52.5125557,13.3832429]], art:"wilhelm", img:"img/wilhelm.jpg", ar:"519/799", ph:"night", book:"wilhelm", name:"Imperial Colonial Office · Reichskolonialamt", note:"Wilhelmstraße 51 (antigo n.º 62), onde hoje fica uma escola, junto ao centro juvenil Ikarus. Aqui funcionou o Ministério Colonial do Império (1907–1920), que administrava as colónias e comandava as tropas coloniais. Saiam do memorial pela Hannah-Arendt-Straße até à Wilhelmstraße. Há painéis históricos no passeio em quase cada número. O antigo Ministério da Educação da RDA (Unter den Linden 71) fica 300 m a norte, na esquina do Hotel Adlon, se quiserem desviar. A fotografia vem de um desses painéis.", route:dir("Holocaust-Mahnmal Berlin","Wilhelmstraße 51, 10117 Berlin"), rl:"A pé · 5 min", photo:"Wilhelmstraße Berlin"},
    {t:"18:15", loc:[["Wilhelmstraße 92, 10117 Berlin",52.5125647,13.3822734]], art:"w92", img:"img/radziwill.jpg", ar:"400/258", ph:"night", book:"w92", name:"Wilhelmstraße 92 · antiga Chancelaria de Bismarck", note:"Do outro lado da rua, um pouco a sul. A gravura antiga mostra o palácio que aqui existia, o Palais Radziwill: foi a Chancelaria de Bismarck, palco da Conferência de Berlim, e Hitler também a usou a partir de 1933. Procurem a placa no passeio.", route:dir("Wilhelmstraße 51, 10117 Berlin",W92), rl:"A pé · 2 min", photo:W92},
    {t:"18:30", loc:[["Wilhelmstraße 94, esquina com a Voßstraße, 10117 Berlin",52.5116069,13.3828302]], art:"chancelaria", img:"img/neuekanzlei.jpg", ar:"900/573", ph:"night", book:"chancelaria", name:"Local da Nova Chancelaria de Hitler", note:"Mesmo ao lado da antiga chancelaria de Bismarck: é o quarteirão seguinte da Wilhelmstraße, na esquina com a Voßstraße, em frente a uma entrada do Mall of Berlin. Hoje só há prédios da RDA. O postal da época mostra a fachada da nova chancelaria de Speer, construída ao lado da antiga, ao longo da Voßstraße.", route:dir(W92,W94), rl:"A pé · 1 min", photo:"Voßstraße Berlin"},
    {t:"18:45", loc:[["Potsdamer Platz, em frente ao n.º 10, 10785 Berlin",52.508451,13.3771342]], art:"potsdamer", img:"img/pedestal.jpg", ar:"800/583", ph:"night", book:"potsdamer", name:"Potsdamer Platz · o pedestal de Liebknecht", note:"Um pedestal de pedra sem estátua em frente ao edifício curvo de tijolo vermelho, por cima da entrada do metro. A fotografia é de dezembro de 1951, pouco depois da inauguração (Bundesarchiv). A inscrição diz que foi deste sítio que Liebknecht apelou, a 1 de maio de 1916, à luta contra a guerra imperialista e pela paz.", route:dir(W94,PP,"walking",["Voßstraße Berlin"]), rl:"A pé · 8 min", photo:"Karl-Liebknecht-Denkmal Potsdamer Platz Berlin"},
    {t:"19:10", loc:[["Besselpark, antiga Friedrichstraße 24, 10969 Berlin",52.5038396,13.391584]], art:"bessel", ph:"night", book:"bessel", name:"Besselpark · Liga para a Defesa da Raça Negra", note:"Pela Leipziger Straße para leste, depois a Wilhelmstraße e a Zimmerstraße até à Friedrichstraße, e daí para sul. O Besselpark é o relvado ao lado da sede do jornal taz. Fim do percurso, a cerca de 650 m do hotel.", route:dir(PP,"Besselpark Berlin","walking",["Zimmerstraße 90, 10117 Berlin"]), rl:"A pé · 15 min", photo:"Besselpark Berlin"}
  ],
  tips:[
    "O percurso vai de oeste para leste: metro até ao Zoo e depois sempre a pé, saltando sempre para o sítio mais próximo, até acabar no Besselpark, perto do hotel. Em novembro o sol põe-se por volta das 16h15, por isso o parque vem primeiro: o Tiergarten é grande e escuro à noite, e o resto do passeio faz-se pelas ruas iluminadas.",
    "Quase nenhuma destas paragens é um monumento. Muitas vezes é uma placa, um painel no passeio ou um espaço vazio, e é isso que o livro ensina a ler.",

};

/* ---------- Mapa do percurso (quarta-feira), desenhado a partir das coordenadas ---------- */
function routeMap(){
  const st=DAYS.revolucao.stops;
  const park=[[52.5148,13.3350],[52.5188,13.3430],[52.5203,13.3560],[52.5197,13.3700],[52.5175,13.3765],[52.5133,13.3765],[52.5098,13.3720],[52.5088,13.3560],[52.5084,13.3430],[52.5100,13.3350]];
  const spree=[[52.5228,13.3290],[52.5207,13.3470],[52.5195,13.3600],[52.5201,13.3690],[52.5224,13.3745],[52.5214,13.3840],[52.5205,13.3920],[52.5180,13.4000],[52.5150,13.4065]];
  const kanal=[[52.5068,13.3290],[52.5089,13.3432],[52.5072,13.3550],[52.5046,13.3650],[52.5026,13.3760],[52.5010,13.3900],[52.4990,13.4065]];
  const streets=[ [[52.5145,13.3501],[52.5163,13.3777]], [[52.5170,13.3806],[52.5086,13.3836]], [[52.5096,13.3770],[52.5100,13.4010]], [[52.5180,13.3770],[52.5088,13.3770]], [[52.5168,13.3777],[52.5172,13.3990]], [[52.5140,13.3770],[52.5139,13.3806]], [[52.5118,13.3770],[52.5114,13.3832]], [[52.5070,13.3790],[52.5072,13.3960]], [[52.5170,13.3890],[52.5020,13.3920]] ];
  const metro=[[52.5098,13.3998],[52.5112,13.4036],[52.5110,13.3920],[52.5097,13.3762],[52.5036,13.3745],[52.4994,13.3746],[52.4993,13.3536],[52.5017,13.3426],[52.5072,13.3326]];
  const walk=[[52.5072,13.3326],[52.5056,13.3406],[52.5089,13.3432],[52.5125,13.3413],[52.5145,13.3501],[52.5186,13.3620],[52.5186,13.3762],[52.5163,13.3777],[52.5133,13.3761],[52.5139,13.3787],[52.5126,13.3832],[52.5126,13.3823],[52.5116,13.3828],[52.5085,13.3771],[52.5096,13.3838],[52.5070,13.3842],[52.5072,13.3905],[52.5038,13.3916]];
  function draw(b, W, onlyFrom, k, labels){
    const [la0,la1,lo0,lo1]=b, Hh=Math.round(W*((la0-la1)*111.2)/((lo1-lo0)*67.85));
    const X=lo=>+((lo-lo0)/(lo1-lo0)*W).toFixed(1), Y=la=>+((la0-la)/(la0-la1)*Hh).toFixed(1);
    const pl=pts=>pts.map(([la,lo])=>X(lo)+","+Y(la)).join(" ");
    const r=13*k, fs=14*k, lf=15*k;
    const marks=st.map((s,i)=>{ if(i<onlyFrom && i!==0) return ""; const [ ,la,lo]=s.loc[0]; const lab=i===0?"H":String(i);
      return `<circle cx="${X(lo)}" cy="${Y(la)}" r="${r}" fill="${i===0?"#3f6fa8":"#1f1b16"}" stroke="#efe6d2" stroke-width="${2.5*k}"/><text x="${X(lo)}" y="${(Y(la)+fs*.36).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="${fs}" fill="#fff">${lab}</text>`; }).join("");
    const s7=st.findIndex(s=>s.art==="stelae"); const [ ,hla,hlo]=st[s7].loc[1];
    const km=(1/((lo1-lo0)*67.85)*W), sb=km>W/3?{w:km*0.2,t:"200 m"}:{w:km,t:"1 km"};
    return `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" role="img">
      <polygon class="m-park" points="${pl(park)}"/>
      <polyline class="m-water" style="stroke-width:${9*k}" points="${pl(spree)}"/><polyline class="m-water" style="stroke-width:${5*k}" points="${pl(kanal)}"/>
      ${streets.map(x=>`<polyline class="m-street" style="stroke-width:${5*k}" points="${pl(x)}"/>`).join("")}
      <polyline class="m-metro" style="stroke-width:${3*k};stroke-dasharray:${8*k} ${6*k}" points="${pl(metro)}"/>
      <polyline class="m-route" style="stroke-width:${4.5*k}" points="${pl(walk)}"/>
      ${labels.map(([la,lo,t,c,it])=>`<text x="${X(lo)}" y="${Y(la)}" font-family="IBM Plex Mono,monospace" font-size="${lf}" fill="${c||"#5f5446"}"${it?' font-style="italic"':""}>${t}</text>`).join("")}
      <circle cx="${X(hlo)}" cy="${Y(hla)}" r="${7*k}" fill="#1f1b16" stroke="#efe6d2" stroke-width="${2*k}"/>
      ${marks}
      <g transform="translate(${W-40*k} ${40*k})"><path d="M0 ${-22*k} L${6*k} 0 L0 ${22*k} L${-6*k} 0 Z" fill="#1f1b16"/><text y="${-27*k}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="${lf}" fill="#1f1b16">N</text></g>
      <g transform="translate(${20*k} ${Hh-18*k})"><rect width="${sb.w.toFixed(1)}" height="${6*k}" fill="#1f1b16"/><text y="${-8*k}" font-family="IBM Plex Mono,monospace" font-size="${lf}" fill="#1f1b16">${sb.t}</text></g>
    </svg>`;
  }
  const full=draw([52.5232,52.4970,13.3290,13.4065], 900, 0, 1.9, [
    [52.5108,13.3530,"Tiergarten","#5c6b45",1],[52.5216,13.3330,"Spree","#5f7f93"],[52.5052,13.3600,"Landwehrkanal","#5f7f93"],
    [52.4980,13.3560,"U2","#3f6fa8"],[52.5046,13.3300,"Zoo"]]);
  const zoom=draw([52.5196,52.5028,13.3700,13.3935], 900, st.findIndex(x=>x.art==="reichstag"), 2.1, [
    [52.5178,13.3704,"Tiergarten","#5c6b45",1],[52.5173,13.3792,"Unter den Linden"],
    [52.5152,13.3814,"Wilhelmstr."],[52.5072,13.3712,"Potsdamer Pl."],[52.5062,13.3800,"Zimmerstr."]]);
  const legend=`<ol>${st.map((s,i)=>`<li><b>${i===0?"H":i}</b>${s.t} · ${s.name.split(" · ")[0]}</li>`).join("")}</ol>`;
  const leg1=dir("Olof-Palme-Platz Berlin","Reichstagsgebäude Berlin","walking",[RT,LK,"Großer Stern Berlin",HKW]);
  const leg2=dir("Reichstagsgebäude Berlin",PP,"walking",[BT,HOMO,"Holocaust-Mahnmal Berlin","Wilhelmstraße 51, 10117 Berlin",W92,W94]);
  const leg3=dir(PP,"Besselpark Berlin","walking",["Zimmerstraße 90, 10117 Berlin"]);
  return `<div class="maptitle">Percurso completo</div>${full}<div class="maptitle">Pormenor: do Reichstag ao Besselpark</div>${zoom}`+legend+`<div class="maplinks"><a class="btn primary" href="${leg1}" target="_blank" rel="noopener">${ICON_ROUTE}Zoo → Reichstag</a><a class="btn primary" href="${leg2}" target="_blank" rel="noopener">${ICON_ROUTE}Reichstag → Potsdamer Platz</a><a class="btn primary" href="${leg3}" target="_blank" rel="noopener">${ICON_ROUTE}Potsdamer Platz → Besselpark</a></div><p class="mapnote">Esquema simplificado: parque, rios e ruas aproximados; paragens nas coordenadas exatas. Linha castanha: a pé. Tracejado azul: U2. O ponto pequeno junto ao 7 é o Memorial do Holocausto.</p>`;
}

/* ---------- Cartaz construtivista (passeio revolucionário) ---------- */
function revBanner(){
  const pts=[[34,140,"Zoo"],[70,132,""],[104,108,""],[150,88,"Spree"],[184,102,"Reichstag"],[214,120,""],[244,134,"Wilhelmstraße"],[290,158,"Potsdamer Platz"],[326,152,""],[350,166,"Besselpark"]];
  const path="M"+pts.map(p=>p[0]+" "+p[1]).join(" L");
  let grid=""; for(let x=0;x<=400;x+=40) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="230" stroke="#8a7a5c" stroke-width=".4" opacity=".45"/>`; for(let y=0;y<=230;y+=40) grid+=`<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#8a7a5c" stroke-width=".4" opacity=".45"/>`;
  const rose=`<g transform="translate(352 58)" opacity=".75"><circle r="22" fill="none" stroke="#5f5446" stroke-width=".8"/><circle r="15" fill="none" stroke="#5f5446" stroke-width=".5"/><path d="M0 -26 L4 0 L0 26 L-4 0 Z" fill="#1f1b16"/><path d="M-26 0 L0 4 L26 0 L0 -4 Z" fill="#7b4a2a"/><text y="-30" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#1f1b16">N</text></g>`;
  return `<div class="revbanner"><svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Berlim Colonial e Terceiro Reich · quarta-feira">
    <rect width="400" height="230" fill="#efe6d2"/>${grid}${rose}
    <rect x="10" y="10" width="380" height="210" fill="none" stroke="#1f1b16" stroke-width=".8"/>
    <text x="24" y="38" font-family="IBM Plex Mono,monospace" font-weight="500" font-size="10" letter-spacing="1.2" fill="#7b4a2a">PERCURSO · QUARTA-FEIRA · 15H00</text>
    <text x="22" y="70" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="27" fill="#1f1b16">Berlim Colonial</text>
    <text x="22" y="98" font-family="Fraunces,Georgia,serif" font-weight="600" font-size="21" font-style="italic" fill="#1f1b16">e Terceiro Reich</text>
    <path d="${path}" fill="none" stroke="#1f1b16" stroke-width="1.2" stroke-dasharray="3 3" transform="translate(10 26)"/>
    ${pts.map(([x,y,l])=>`<circle cx="${x+10}" cy="${y+26}" r="${l?3.6:2.2}" fill="${l?"#7b4a2a":"#efe6d2"}" stroke="#1f1b16" stroke-width="1"/>${l?`<text x="${x+10}" y="${y+41}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" fill="#3d352b">${l}</text>`:""}`).join("")}
  </svg></div>`;
}

/* ---------- Render ---------- */
const ICON_ROUTE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>`;
const ICON_PHOTO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>`;

const store = { get(k){ try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} } };
const doneKey = "berlim-feito-v1";
let done = store.get(doneKey);

function render(dayId){
  const d = DAYS[dayId], el = document.getElementById("day-"+dayId);
  el.innerHTML = `${dayId==="domingo"?ostBanner():(dayId==="revolucao"?revBanner():westBanner())}<div class="daymeta">${d.chips.map(c=>`<span class="chip">${c}</span>`).join("")}${d.map?`<button class="chip chipbtn" type="button" data-map="${dayId}" aria-expanded="false">🗺️ Mapa do percurso</button>`:""}</div>${d.map?`<div class="mapbox" id="map-${dayId}" hidden>${d.map()}</div>`:""}
  <ol class="timeline">${d.stops.map((s,i)=>{
    const id = dayId+"-"+i, isDone = !!done[id];
    return `<li class="stop${isDone?" done":""}" data-id="${id}" data-t="${s.t}">
      <div class="time">${s.t}</div>
      <article class="card">
        ${s.img ? `<img class="photo" src="${s.img}"${s.ar?` style="aspect-ratio:${s.ar}"`:""} alt="${s.name}" loading="lazy">` : ART[s.art](s.ph)}
        <div class="body">
          <div class="nowtag">Agora</div>
          ${s.loc?`<div class="addr">${s.loc.map(([a,la,lo])=>`<div>${a} · <a href="https://www.google.com/maps/search/?api=1&query=${la},${lo}" target="_blank" rel="noopener">${la.toFixed(5)}° N, ${lo.toFixed(5)}° E</a></div>`).join("")}</div>`:""}
          <h3 class="name">${s.name}</h3>
          <p class="note">${s.note}</p>
          ${s.book?bookBlock(s.book):""}
          ${aboutBlock(s.art)}
          ${moreBlock(s.art)}
          <div class="actions">
            ${s.route?`<a class="btn primary" href="${s.route}" target="_blank" rel="noopener">${ICON_ROUTE}${s.rl}</a>`:""}
            ${s.route2?`<a class="btn primary" href="${s.route2}" target="_blank" rel="noopener">${ICON_ROUTE}${s.rl2}</a>`:""}
            <a class="btn" href="${place(s.photo)}" target="_blank" rel="noopener">${ICON_PHOTO}Fotos</a>
            <label class="check"><input type="checkbox" ${isDone?"checked":""} data-id="${id}">Feito</label>
          </div>
        </div>
      </article>
    </li>`}).join("")}</ol>
  <aside class="tips"><h2>A ter em conta</h2><ul>${d.tips.map(t=>`<li>${t}</li>`).join("")}</ul></aside>`;
}

function show(dayId){
  if(!DAYS[dayId]) dayId = defaultDay();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.day===dayId)));
  document.querySelectorAll("section[data-day]").forEach(s=>s.hidden = s.dataset.day!==dayId);
  document.body.dataset.day = dayId;
  document.getElementById("sub").textContent = (DAYS[dayId].hotel ? "Partida: " + DAYS[dayId].hotel : "Partida e chegada: " + H);
  markNow();
}
function defaultDay(){ const t=new Date(); const iso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; return iso===DAYS.domingo.date ? "domingo" : "sabado"; }

function markNow(){
  const t=new Date(); const iso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  const mins=t.getHours()*60+t.getMinutes();
  document.querySelectorAll(".stop.now").forEach(e=>e.classList.remove("now"));
  for(const id of Object.keys(DAYS)){
    if(DAYS[id].date!==iso) continue;
    const items=[...document.querySelectorAll(`#day-${id} .stop`)];
    const toM = s=>{const [h,m]=s.split(":").map(Number); return h*60+m;};
    let cur=null; items.forEach(li=>{ if(toM(li.dataset.t)<=mins) cur=li; });
    if(cur) cur.classList.add("now");
  }
}

Object.keys(DAYS).forEach(render);
document.addEventListener("change", e=>{
  const cb=e.target.closest('input[type="checkbox"][data-id]'); if(!cb) return;
  done[cb.dataset.id]=cb.checked; if(!cb.checked) delete done[cb.dataset.id]; store.set(doneKey,done);
  cb.closest(".stop").classList.toggle("done", cb.checked);
});
document.addEventListener("click", e=>{
  const b=e.target.closest(".chipbtn[data-map]"); if(!b) return;
  const box=document.getElementById("map-"+b.dataset.map); box.hidden=!box.hidden;
  b.setAttribute("aria-expanded", String(!box.hidden));
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ location.hash=b.dataset.day; show(b.dataset.day); window.scrollTo({top:0}); }));
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
setInterval(markNow, 60000);
</script>
