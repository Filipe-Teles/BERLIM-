  humboldt:`
<h4>O parque do século XIX</h4>
<p>Depois do Volkspark Friedrichshain, concluído em 1846 para o leste da cidade, Berlim decidiu criar um parque de recreio, tão natural quanto possível, para os bairros operários do norte. O Humboldthain foi desenhado por Gustav Meyer, o primeiro diretor de jardins da cidade, e construído entre 1869 e 1876. O nome homenageia o naturalista Alexander von Humboldt. Ocupa 29 hectares no bairro de Gesundbrunnen, no Wedding.</p>
<h4>A torre antiaérea</h4>
<p>Entre outubro de 1941 e abril de 1942, o regime nazi ergueu no parque a "Flakturm III", uma torre de artilharia antiaérea, e uma torre de comando de tiro, construídas com trabalho forçado. Eram a terceira de três torres deste tipo em Berlim, depois das do Jardim Zoológico e de Friedrichshain, e serviam também de abrigo para milhares de civis. A torre principal tinha cerca de 10 000 toneladas de aço e 100 000 toneladas de betão, e chegava aos 42 metros de altura.</p>
<h4>Demolição impossível</h4>
<p>Depois da guerra, o parque ficou no setor francês. A torre de comando foi demolida e enterrada. A torre principal resistiu a várias tentativas de demolição dos engenheiros franceses, entre elas uma em março de 1948, e só foi destruída em parte, também porque a proximidade das linhas de comboio limitava o uso de explosivos. A face norte ficou de pé.</p>
<h4>A colina de entulho</h4>
<p>Entre 1948 e 1951, os restos foram cobertos com cerca de 1,5 milhões de metros cúbicos de entulho de prédios destruídos de toda a cidade. A colina recebeu o nome de Humboldthöhe num concurso público, e o parque redesenhado foi inaugurado a 13 de setembro de 1952. A colina tem cerca de 85 m de altitude, e chega-se ao topo por uma escadaria de 163 degraus ou por um caminho em curvas que segue o traçado da antiga linha férrea que transportava o entulho. Lá em cima está a escultura <em>Monumento à Unidade da Alemanha</em>, de Arnold Schatz (1963–67). Uma colina mais pequena, a sul, serve de pista de trenó no inverno.</p>
<h4>Hoje</h4>
<p>As plataformas da torre são um miradouro sobre Berlim, muito procurado ao pôr do sol. As paredes do bunker são usadas para escalada pelo Clube Alpino Alemão. Por dentro, a associação Berliner Unterwelten faz visitas guiadas às partes acessíveis da torre, entre abril e outubro, porque no inverno ela é refúgio de cerca de 250 morcegos, o terceiro maior local de hibernação de Berlim.</p>
<p>O parque tem ainda um roseiral, considerado um dos recantos mais bonitos da cidade, e uma piscina ao ar livre com tanque de 50 metros, construída nos anos 50.</p>`,
  soviet:`
<h4>O que é</h4>
<p>É ao mesmo tempo memorial de guerra e cemitério militar. Homenageia os cerca de 80 000 soldados do Exército Vermelho mortos na Batalha de Berlim, em abril e maio de 1945, e cerca de 7000 estão aqui sepultados, uns 5000 no campo central. É o maior dos três memoriais soviéticos de Berlim, a par do de Tiergarten (1945) e do de Schönholzer Heide, em Pankow. Com o monumento da "Retaguarda à Frente", em Magnitogorsk, e a estátua "A Pátria Chama", em Volgogrado, é visto como parte de um tríptico.</p>
<h4>Construção</h4>
<p>O lugar era um antigo campo desportivo do Treptower Park. Pouco depois do fim da guerra abriu-se um concurso, que recebeu 33 propostas, e o projeto final combinou várias delas. A equipa era liderada pelo arquiteto Yakov Belopolsky, com o escultor Yevgeny Vuchetich, o pintor Alexander Gorpenko e a engenheira Sarra Walerius.</p>
<p>As esculturas, os relevos e as taças de fogo, com 2,5 m de diâmetro, foram fundidos em 1948 na fundição de arte de Lauchhammer. A obra durou mais de três anos e envolveu cerca de 1200 operários, 200 canteiros e 90 escultores. Diz-se muitas vezes que o granito veio das ruínas da Chancelaria de Hitler, mas a Wikipédia classifica esse rumor como falso. O memorial foi inaugurado a 8 de maio de 1949, quatro anos depois do fim da guerra na Europa.</p>
<h4>O percurso</h4>
<p>Entra-se por um de dois arcos monumentais, que levam a uma estátua de mulher que chora os filhos, a "Mãe Pátria". Segue-se um portal formado por duas bandeiras soviéticas estilizadas em granito vermelho, com um soldado ajoelhado de cada lado.</p>
<p>Depois abre-se o campo central, ladeado por 16 sarcófagos de pedra, um por cada república soviética da época, com relevos de cenas de guerra e citações de Estaline em russo e alemão.</p>
<p>No fim do eixo, sobre um monte, está a estátua de bronze de 12 metros de Vuchetich: um soldado de espada na mão, com uma criança alemã ao colo, a pisar uma suástica partida. O marechal Chuikov disse que ela homenageia o sargento Nikolai Masalov, que terá arriscado a vida debaixo de fogo de metralhadora para salvar uma menina alemã de três anos nos últimos combates no centro de Berlim.</p>
<h4>Na RDA e depois</h4>
<p>Foi o principal memorial de guerra da RDA. No fim de 1989 apareceram grafitos antissoviéticos, e a 3 de janeiro de 1990 cerca de 250 000 pessoas manifestaram-se aqui, numa concentração convocada por um pequeno partido trotskista e apoiada pelo PDS, o sucessor do partido de Estado. O historiador Stefan Wolle levantou a hipótese de a pintura ter sido obra da própria Stasi. Em 1994, a cerimónia de despedida das tropas russas contou com Helmut Kohl e Boris Ieltsin.</p>
<p>Pelo Tratado Dois Mais Quatro, a Alemanha ficou responsável pela manutenção e tem de consultar a Rússia antes de qualquer alteração. Entre 2003 e 2004, a estátua foi levada de barco para uma oficina na ilha de Rügen e restaurada, com limpeza, nova pátina, substituição de 2200 parafusos e uma estrutura interna de aço inoxidável, por cerca de 1,5 milhões de euros. A despesa foi criticada por contraste com a falta de indemnizações a pessoas deportadas para a URSS.</p>
<p>Uma parte dos berlinenses dá-lhe uma alcunha amarga, em referência às violações em massa cometidas por soldados soviéticos em 1945. Desde 1995 há uma vigília anual a 9 de maio. Depois da invasão da Ucrânia voltou a discutir-se a demolição, e o memorial tem sido alvo de pinturas.</p>`,

  eastside:`
<h4>O troço</h4>
<p>Estende-se ao longo da Mühlenstraße, entre a Ostbahnhof e a Oberbaumbrücke, à beira do Spree, com 1316 metros. É o troço mais longo do Muro que ainda está de pé. Não era a fronteira propriamente dita, que aqui passava pela margem de Kreuzberg do rio: era o muro interior ("Hinterlandmauer"), que fechava a faixa de fronteira do lado de Berlim Leste e era mais grosso e mais fortificado do que o exterior.</p>
<h4>Como nasceu</h4>
<p>O projeto surgiu em 1990, depois da fusão das associações de artistas plásticos do Leste (VBK) e do Oeste (BBK). Os fundadores foram Bodo Sperling, Barbara Greul Aschanta, Jörg Kubitzki e David Monti. Na primavera de 1990, 118 artistas de 21 países pintaram o muro, que se tornou uma galeria a céu aberto e, segundo a associação de artistas, um monumento à queda do Muro.</p>
<h4>As obras</h4>
<p>A mais famosa é a nº 25, de Dmitri Vrubel, que mostra o beijo fraterno entre Leonid Brejnev e Erich Honecker, com o título <em>Meu Deus, ajuda-me a sobreviver a este amor mortal</em>. Vrubel pintou também uma homenagem a Andrei Sakharov. Outros nomes conhecidos são Thierry Noir, Jim Avignon, Kim Prisu, Kani Alavi, Kasra Alavi, Jürgen Große ("Indiano"), Birgit Kinder, com "Test the Rest", e Gerhard Lahr, com "Berlyn".</p>
<h4>Conservação e polémicas</h4>
<p>É monumento classificado e recebe mais de três milhões de visitantes por ano. A erosão, os grafitos e o vandalismo danificaram muito as pinturas, e a partir de 2000 uma associação sem fins lucrativos restaurou cerca de um terço. Em 2009 as obras foram repintadas por cima das originais. Oito dos artistas de 1990 recusaram repintar as suas e formaram uma iniciativa para defender os direitos de autor. Em 2011, Bodo Sperling levou a tribunal a questão de saber se uma obra pode ser apagada e recopiada sem autorização do artista.</p>
<p>Em 2006, um troço de 40 m foi deslocado para abrir acesso ao rio junto à arena desportiva. A 1 de março de 2013, começou a demolição de 23 m para a construção de apartamentos de luxo, sem aviso aos artistas. Os protestos obrigaram a suspender a obra.</p>
<p>Desde novembro de 2018, a gestão está a cargo da Fundação do Muro de Berlim. O muro aparece no filme <em>Adeus, Lenine!</em> e no vídeo de "One", dos U2.</p>
<h4>Oberbaumbrücke</h4>
<p>No lugar de uma ponte de madeira ligada ao muro aduaneiro de 1732, a atual foi construída em dois anos e inaugurada em 1896, a tempo da Exposição Industrial de Berlim. O projeto é de Otto Stahn, em gótico de tijolo do norte da Alemanha, com arcos ogivais e abóbadas, e por cima circula o metro elevado.</p>
<p>Em abril de 1945, a Wehrmacht fez explodir o tramo central. Depois de 1961, a ponte marcava a fronteira entre Leste e Oeste. A partir de dezembro de 1963 passou a ser travessia de peões para berlinenses ocidentais, e de forma permanente depois do Acordo das Quatro Potências de 1972.</p>
<p>Restaurada com um novo tramo central em aço de Santiago Calatrava, reabriu a 9 de novembro de 1994. Ligava dois distritos de lados opostos do Muro e por isso aparece no brasão de Friedrichshain-Kreuzberg, que se fundiram em 2001.</p>`,

  market:`
<h4>A praça</h4>
<p>Antes de 1900 chamava-se apenas "Praça D". O nome atual, dado em 1900, vem de uma antiga quinta da zona, o Vorwerk Boxhagen, e as obras terminaram em 1903. Por volta de 1925 ganhou um tanque para crianças com esculturas de pinguins e patos, segundo projeto de Erwin Barth. É jardim classificado.</p>
<p>O antigo urinol octogonal de ferro fundido, o "Café Achteck", do século XIX, ardeu em 1992 e reabriu em 2000. Em 2004 a praça foi remodelada, com vedação e um parque infantil.</p>
<h4>O bairro</h4>
<p>Os moradores chamam-lhe "Boxi" e usam a praça como relvado, ponto de encontro, parque infantil e mercado. A zona, operária desde a industrialização, mudou pouco durante a RDA. Depois de 1989 houve muitas casas ocupadas, até à violenta desocupação da Mainzer Straße, em 1990. Uma dessas antigas ocupações, na Grünberger Straße 73, existe ainda como projeto legal.</p>
<p>Entre 1999 e 2005, um programa de gestão de bairro abrangeu cerca de 75 hectares e 18 500 habitantes, numa das maiores densidades populacionais da cidade. A população cresceu, rejuvenesceu (a maioria tem entre 18 e 35 anos) e tornou-se mais internacional.</p>
<h4>Gentrificação</h4>
<p>A requalificação trouxe prédios renovados, lojas novas e rendas mais altas. Os apartamentos pequenos, de um e dois quartos, fazem com que os moradores mudem muito.</p>
<h4>Mercados</h4>
<p>Ao sábado há mercado de produtores desde 1905, com fruta, legumes, carne, peixe, pão e especialidades. Ao domingo há a feira da ladra, que em 2004 foi reduzida depois de queixas dos moradores e onde hoje há mais vendedores profissionais do que particulares.</p>`,

  stasi:`
<h4>A Stasi</h4>
<p>O Ministério da Segurança do Estado (MfS), conhecido como Stasi, foi criado a 8 de fevereiro de 1950. Era ao mesmo tempo polícia política, serviço de informações e polícia de investigação criminal, e o seu lema era "escudo e espada do Partido". Queria "saber tudo sobre todos".</p>
<p>No fim tinha cerca de 90 000 funcionários a tempo inteiro e mais de 170 000 colaboradores não oficiais (IM), quase 2% da população. Somando os informadores ocasionais, estima-se que houvesse um por cada 6,5 habitantes. Manteve ficheiros sobre cerca de 5,6 milhões de pessoas, com escutas, vigilância por vídeo, abertura de correio, chantagem e suborno. Erich Mielke dirigiu-a de 1957 a 1989.</p>
<h4>A sede</h4>
<p>O complexo de escritórios da Normannenstraße, em Lichtenberg, foi crescendo até ocupar quarteirões inteiros, fechados ao exterior. O Haus 1, onde está o museu, foi construído em 1960–61 como sede do ministro.</p>
<h4>O assalto à sede</h4>
<p>No outono de 1989, com o regime a cair, os funcionários começaram a destruir ficheiros: à mão, em incineradoras e em trituradoras. A escritora Anna Funder conta que as trituradoras sobreaqueceram e que a Stasi chegou a mandar agentes comprar mais a Berlim Ocidental.</p>
<p>A partir de 4 de dezembro de 1989, cidadãos ocuparam sedes regionais da Stasi, a começar por Erfurt e Leipzig. A 13 de janeiro de 1990 o ministério foi formalmente dissolvido, e a 15 de janeiro, numa manifestação convocada pelo Neues Forum, milhares de pessoas forçaram a entrada na sede de Berlim para travar a destruição. Entre elas havia antigos colaboradores que queriam fazer desaparecer provas. Os ficheiros salvos foram essenciais para julgar crimes da Stasi e, depois da reunificação, ficaram a cargo de uma autoridade própria, a primeira dirigida por Joachim Gauck, que abriu aos cidadãos a consulta dos seus próprios processos.</p>
<h4>O museu</h4>
<p>A associação ASTAK foi fundada no verão de 1990 por ativistas dos direitos civis, e o museu abriu a 7 de novembro de 1990. Conserva o gabinete de Mielke, a antecâmara, a mesa de reuniões, a central telefónica e uma área de lazer. Desde 2015 tem a exposição permanente "A Segurança do Estado na ditadura do SED", feita com a autoridade dos arquivos da Stasi.</p>
<p>No antigo parque de estacionamento, a exposição ao ar livre "Revolução e Queda do Muro", da Sociedade Robert Havemann, abriu em junho de 2016. O museu recebe cerca de 100 000 visitantes por ano.</p>`,

  kma:`
<h4>Nomes e dimensões</h4>
<p>A rua chamou-se Frankfurter Straße (por volta de 1701), depois Große Frankfurter Straße (até 1872) e Frankfurter Allee. De 1949 a 1961 foi Stalinallee, e desde então é Karl-Marx-Allee. Tem 2,3 km de comprimento e 90 m de largura, entre Mitte e Friedrichshain.</p>
<h4>A montra do socialismo</h4>
<p>A RDA construiu-a entre 1949 e 1960 como peça central da reconstrução do pós-guerra e montra do urbanismo socialista: habitação digna para trabalhadores, comércio e cultura. Os arquitetos foram Hermann Henselmann, Egon Hartmann, Hans Hopp, Kurt W. Leucht, Richard Paulick e Josef Souradny.</p>
<p>Os "palácios para operários", de oito andares, seguem o "classicismo socialista" de inspiração estalinista, conhecido como estilo "bolo de noiva", com motivos berlinenses inspirados em Schinkel e fachadas revestidas a cerâmica. Henselmann desenhou as torres gémeas da Frankfurter Tor e da Strausberger Platz. Nos anos 80 os azulejos começaram a cair, e foi preciso pôr resguardos para os peões.</p>
<p>O arquiteto americano Philip Johnson chamou-lhe verdadeiro urbanismo em grande escala, e o italiano Aldo Rossi, a última grande rua da Europa.</p>
<h4>17 de junho de 1953</h4>
<p>Os operários que construíam a avenida pararam o trabalho em protesto contra o aumento das normas de produção. O protesto espalhou-se a toda a RDA e foi esmagado pelos tanques soviéticos, com muitos mortos. Bertolt Brecht escreveu sobre isso um poema satírico, "A Solução".</p>
<h4>Estaline sai, Marx entra</h4>
<p>Em 1951 foi erguida uma estátua monumental de Estaline, oferecida para o Festival Mundial da Juventude. Em 1961, com a desestalinização, foi retirada discretamente e a avenida passou a chamar-se Karl-Marx-Allee. Era aqui que se faziam os desfiles do 1.º de Maio, com material militar. Nas lojas, os visitantes ocidentais tinham de provar que tinham trocado marcos ao câmbio oficial de 1 para 1, quando no Ocidente o câmbio era de cerca de 8 para 1.</p>
<h4>Kino International</h4>
<p>Projetado por Josef Kaiser, abriu a 15 de novembro de 1963 e foi a principal sala de estreias da RDA, sobretudo de filmes dos estúdios DEFA. A última estreia da RDA foi "Coming Out", de Heiner Carow, a 9 de novembro de 1989, a noite em que caiu o Muro. Tem 555 lugares e 14 relevos nas fachadas laterais, e é uma das salas da Berlinale. Fechou em maio de 2024 para cerca de dois anos de obras, com reabertura anunciada para o início de 2026.</p>
<h4>Uma curiosidade</h4>
<p>Em 2009, alguém escreveu anonimamente na Wikipédia alemã que a avenida tinha a alcunha de "casa de banho de Estaline", por causa dos azulejos. Os jornais repetiram a expressão até o jornalista Andreas Kopietz, do Berliner Zeitung, admitir que a tinha inventado.</p>`,

  alex:`
<h4>Das origens a 1805</h4>
<p>No século XIII havia aqui um hospital de São Jorge, que deu nome à Porta de São Jorge. Até cerca de 1400 a zona era quase vazia, e por causa da forca próxima era conhecida como "jardim de recreio do diabo". No século XVI, a porta tornou-se a mais importante de Berlim, por onde entravam as mercadorias do norte e das cidades hanseáticas, e em frente realizava-se um mercado de gado. Em 1701, Frederico I entrou por ela depois da coroação, e passou a chamar-se Porta do Rei. Foi demolida em 1746.</p>
<p>A 25 de outubro de 1805, o czar Alexandre I foi recebido na praça de armas em frente à antiga porta, e a 2 de novembro o rei Frederico Guilherme III deu-lhe o nome de Alexanderplatz.</p>
<h4>A grande cidade</h4>
<p>No século XIX, o bairro de Königsstadt encheu-se de prédios de cinco andares. A praça foi palco de combates de rua na revolução de 1848, ganhou a estação de comboio em 1882, o Grand Hotel (1884) e o mercado central. Em 1886–90 foi construída a sede da polícia, a "Fortaleza Vermelha", tão famosa que "o Alex" passou a ser sinónimo de polícia. Em 1895 foi erguida a estátua de cobre Berolina, com 7,5 m. Os grandes armazéns Tietz, Wertheim e Hahn chegaram a seguir: a fachada do Tietz, com 250 m, era descrita como a mais longa do mundo.</p>
<p>No antigo Haus des Lehrers (1908) realizaram-se em 1919 as cerimónias fúnebres de Karl Liebknecht e Rosa Luxemburg, e em 1920 o congresso de unificação dos comunistas. Alfred Döblin deu à praça o título do seu romance <em>Berlin Alexanderplatz</em>, e Walter Ruttmann filmou-a em 1927 para <em>Berlim, Sinfonia de uma Capital</em>.</p>
<h4>Guerra</h4>
<p>Entre 1941 e 1943 construiu-se por baixo um dos maiores abrigos antiaéreos de Berlim. A Berolina foi retirada em 1944, provavelmente para ser fundida. Em abril de 1945 a praça foi bombardeada pela artilharia soviética. Depois da guerra, as ruínas acolheram um mercado negro.</p>
<h4>O centro de Berlim Leste</h4>
<p>Nos anos 60 e 70, a RDA alargou a praça, tornou-a pedonal e rodeou-a de edifícios modernistas: o novo Haus des Lehrers, de Hermann Henselmann, com o friso de mosaico sobre a vida socialista, o Hotel Stadt Berlin (125 m) e a Haus des Reisens. Em 1969 surgiram o relógio mundial, com a hora de 148 cidades, e a Fernsehturm. Em 1970, a Fonte da Amizade entre os Povos, de Walter Womacka.</p>
<h4>A Fernsehturm</h4>
<p>Os correios da RDA planeavam uma torre de televisão desde 1952, mas o primeiro local ficava demasiado perto do aeroporto de Schönefeld. Em 1964, Walter Ulbricht exigiu um local central e aprovou um desenho inspirado na torre de Estugarda e no satélite Sputnik. Os arquitetos foram Hermann Henselmann, Jörg Streitparth, Fritz Dieter, Günter Franke e Werner Ahrendt.</p>
<p>A obra começou a 4 de agosto de 1965 e a torre foi inaugurada a 3 de outubro de 1969, nos 20 anos da RDA. Custou mais de 132 milhões de marcos, quatro vezes o previsto. A esfera tem 32 m de diâmetro e 4800 toneladas, com o miradouro a cerca de 203 m, de onde se veem até 42 km, e o restaurante giratório a 207 m. Os elevadores sobem em cerca de 40 segundos, e há 986 degraus.</p>
<p>Com a nova antena de 1997, passou de 365 para 368 m, e é a estrutura mais alta da Alemanha. Quando o sol bate na esfera de aço forma-se uma cruz luminosa, a que os berlinenses chamaram "a vingança do Papa", por causa das cruzes que o regime tirava das igrejas. Reagan referiu-a no discurso de 1987. É monumento classificado desde 1979 e recebe cerca de 1,2 milhões de visitantes por ano.</p>
<h4>4 de novembro de 1989</h4>
<p>Foi a maior manifestação não organizada pelo Estado da história da RDA. Centenas de milhares de pessoas, entre opositores, artistas e até dirigentes do partido, exigiram reformas e liberdade de expressão, de reunião e de viajar. Cinco dias depois, o Muro abriu.</p>
<h4>Depois da reunificação</h4>
<p>Em 1993, Hans Kollhoff ganhou o concurso para redesenhar a praça, com uma ferradura de prédios e torres de 150 m. Só uma parte avançou, como o centro comercial Alexa (2007). Em 2026 estavam em construção as torres Covivio (130 m) e The Berlinian (146 m), e a Alexander Tower estava parada desde 2022.</p>`,

  nikolai:`
<h4>O berço de Berlim</h4>
<p>É o núcleo mais antigo da cidade, fundado por volta de 1200, entre a Spandauer Straße, a Rathausstraße, o Spree e o Mühlendamm. Com Cölln, na outra margem, formou a Berlim medieval.</p>
<h4>A Igreja de São Nicolau</h4>
<p>Foi construída entre 1220 e 1230 e é a igreja e o edifício mais antigos de Berlim. Era católica e passou ao luteranismo em 1539. Foram pastores ou músicos dela o grande autor de hinos Paul Gerhardt, o compositor Johann Crüger e o teólogo Philipp Jacob Spener. O último culto foi a 31 de outubro de 1938, e nesse ano foi entregue ao Estado para servir de sala de concertos e museu.</p>
<p>Os bombardeamentos destruíram o telhado e o topo das torres, e em 1949 as abóbadas ruíram. A RDA reconstruiu-a entre 1980 e 1983, a partir de desenhos e plantas históricas. Hoje é um museu do Stadtmuseum Berlin e uma sala de concertos com boa acústica, com um órgão Jehmlich de 44 registos.</p>
<h4>A reconstrução de 1987</h4>
<p>Preservado durante séculos, o bairro medieval foi arrasado pelos bombardeamentos e pela Batalha de Berlim. Para os 750 anos da cidade, em 1987, as autoridades de Berlim Leste reconstruíram-no como "coração histórico", misturando réplicas de casas antigas com prédios de painéis pré-fabricados de betão. Muitas das fachadas "antigas" que se veem são, por isso, recriações dos anos 80.</p>`
});

function moreBlock(key){
  const m = MORE[key]; if(!m) return "";
  return `<details class="more"><summary><span class="ico">+</span>Saber mais</summary><div class="txt">${m}<p class="src">Texto escrito a partir dos artigos da Wikipédia indicados na barra acima.</p></div></details>`;
}


/* ---------- Cartaz de Berlim Leste (domingo) ---------- */
function star(cx,cy,R,r,fill){ let p=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1)); } return `<polygon points="${p.join(" ")}" fill="${fill}"/>`; }
function emblem(cx,cy,s){
  const G="#f2c14e"; let ears="";
  const ear=(deg)=>{ const a=deg*Math.PI/180, x=Math.cos(a)*40, y=Math.sin(a)*40; return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3.6" ry="7.5" fill="${G}" transform="rotate(${deg} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; };
  for(let d=105; d<=250; d+=13) ears+=ear(d);
  for(let d=-70; d<=75; d+=13) ears+=ear(d);
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <circle r="31" fill="#a50e19" stroke="${G}" stroke-width="1.5"/>
    ${ears}
    <rect x="-2.6" y="-18" width="5.2" height="44" rx="1.5" fill="${G}"/>
    <rect x="-15" y="-25" width="30" height="9" rx="1.5" fill="${G}"/>
    <path d="M0 -30 L-18 22 L-13 23 L0 -17 L13 23 L18 22 Z" fill="${G}"/>
    <circle cx="0" cy="-30" r="5" fill="${G}" stroke="#a50e19" stroke-width="1.5"/>
    <path d="M-20 18 h40" stroke="${G}" stroke-width="2.4"/>
    <g transform="translate(0 43)"><rect x="-26" y="-6" width="52" height="4" fill="#111"/><rect x="-26" y="-2" width="52" height="4" fill="#dd1c2b" stroke="#fbe9c8" stroke-width=".6"/><rect x="-26" y="2" width="52" height="4" fill="${G}"/></g>
  </g>`;
}
function ostBanner(){
  const cx=92, cy=96; let rays="";
  for(let i=0;i<28;i++){ if(i%2) continue; const a1=i*2*Math.PI/28, a2=(i+1)*2*Math.PI/28, R=520;
    rays+=`<polygon points="${cx},${cy} ${(cx+R*Math.cos(a1)).toFixed(0)},${(cy+R*Math.sin(a1)).toFixed(0)} ${(cx+R*Math.cos(a2)).toFixed(0)},${(cy+R*Math.sin(a2)).toFixed(0)}" fill="#a50e19"/>`; }
  return `<div class="ostbanner"><svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartaz: Berlim Leste">
    <rect width="400" height="210" fill="#c1121f"/>${rays}
    ${emblem(cx,cy,1.25)}
    ${star(368,30,13,5.5,"#f2c14e")}${star(338,24,6,2.5,"#f2c14e")}
    <text x="178" y="64" font-family="Oswald,Impact,sans-serif" font-weight="600" font-size="13" letter-spacing="3" fill="#f2c14e">HAUPTSTADT DER DDR</text>
    <text x="176" y="112" font-family="Oswald,Impact,sans-serif" font-weight="700" font-size="44" fill="#fbf1dc">BERLIM</text>
    <text x="176" y="156" font-family="Oswald,Impact,sans-serif" font-weight="700" font-size="44" fill="#fbf1dc">LESTE</text>
    <text x="178" y="178" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="11" fill="#fbe9c8">Domingo · 8 de novembro</text>
    <rect y="192" width="400" height="6" fill="#111"/><rect y="198" width="400" height="6" fill="#dd1c2b"/><rect y="204" width="400" height="6" fill="#f2c14e"/>
  </svg></div>`;
}


/* ---------- Cartaz da Alemanha Federal (sábado) ---------- */

  const wing = `M-9 -18 L-46 -36 L-47 -27 L-38 -24 L-46 -17 L-36 -14 L-43 -7 L-32 -4 L-37 4 L-24 5 L-27 12 L-9 8 Z`;
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <path d="${wing}" fill="${K}"/><path d="${wing}" fill="${K}" transform="scale(-1 1)"/>
    <path d="M-9 -22 Q0 -27 9 -22 L11 16 L0 24 L-11 16 Z" fill="${K}"/>
    <circle cx="0" cy="-30" r="6.5" fill="${K}"/>
    <path d="M4 -32 L16 -29 L10 -26 L5 -26 Z" fill="${R}"/><circle cx="1.5" cy="-31.5" r="1.3" fill="#ffce00"/>
    <path d="M-11 16 L-18 34 L-8 30 L0 38 L8 30 L18 34 L11 16 Z" fill="${K}"/>
    <path d="M-6 18 L-15 30 M-15 30 l-4 3 M-15 30 l0 5 M-15 30 l4 3" stroke="${R}" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M6 18 L15 30 M15 30 l4 3 M15 30 l0 5 M15 30 l-4 3" stroke="${R}" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>`;
}
function westBanner(){
  return `<div class="westbanner"><svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartaz: Berlim, Alemanha Federal">
    <rect width="400" height="210" fill="#ffffff"/>
    <rect x="0" y="0" width="150" height="210" fill="#ffce00"/>

    <rect x="150" y="0" width="1" height="210" fill="#111"/>

    <rect x="172" y="50" width="206" height="1" fill="#111"/>
    <text x="170" y="112" font-family="Barlow,Inter,Arial,sans-serif" font-weight="700" font-size="58" letter-spacing="-2" fill="#111">Berlim</text>
    <text x="172" y="140" font-family="Barlow,Inter,Arial,sans-serif" font-weight="500" font-size="15" fill="#111">Sábado, 7 de novembro</text>
    <text x="172" y="160" font-family="Barlow,Inter,Arial,sans-serif" font-weight="500" font-size="12" fill="#5d5a55">12.00 – 0.15 Uhr</text>
    <rect x="172" y="174" width="18" height="6" fill="#111"/><rect x="190" y="174" width="18" height="6" fill="#dd0000"/><rect x="208" y="174" width="18" height="6" fill="#ffce00"/>
    <rect y="198" width="400" height="4" fill="#111"/><rect y="202" width="400" height="4" fill="#dd0000"/><rect y="206" width="400" height="4" fill="#ffce00"/>
  </svg></div>`;
}

/* ---------- Render ---------- */
const ICON_ROUTE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>`;
const ICON_PHOTO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>`;

const store = { get(k){ try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} } };
const doneKey = "berlim-feito-v1";
let done = store.get(doneKey);

function render(dayId){
  const d = DAYS[dayId], el = document.getElementById("day-"+dayId);
  el.innerHTML = `${dayId==="domingo"?ostBanner():westBanner()}<div class="daymeta">${d.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
  <ol class="timeline">${d.stops.map((s,i)=>{
    const id = dayId+"-"+i, isDone = !!done[id];
    return `<li class="stop${isDone?" done":""}" data-id="${id}" data-t="${s.t}">
      <div class="time">${s.t}</div>
      <article class="card">
        ${s.img ? `<img class="photo" src="${s.img}"${s.ar?` style="aspect-ratio:${s.ar}"`:""} alt="${s.name}" loading="lazy">` : ART[s.art](s.ph)}
        <div class="body">
          <div class="nowtag">Agora</div>
          <h3 class="name">${s.name}</h3>
          <p class="note">${s.note}</p>
          ${aboutBlock(s.art)}
          ${moreBlock(s.art)}
          <div class="actions">
            ${s.route?`<a class="btn primary" href="${s.route}" target="_blank" rel="noopener">${ICON_ROUTE}${s.rl}</a>`:""}
            ${s.route2?`<a class="btn primary" href="${s.route2}" target="_blank" rel="noopener">${ICON_ROUTE}${s.rl2}</a>`:""}
            <a class="btn" href="${place(s.photo)}" target="_blank" rel="noopener">${ICON_PHOTO}Fotos</a>
            <label class="check"><input type="checkbox" ${isDone?"checked":""} data-id="${id}">Feito</label>
          </div>
        </div>
      </article>
    </li>`}).join("")}</ol>
  <aside class="tips"><h2>A ter em conta</h2><ul>${d.tips.map(t=>`<li>${t}</li>`).join("")}</ul></aside>`;
}

function show(dayId){
  if(!DAYS[dayId]) dayId = defaultDay();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.day===dayId)));
  document.querySelectorAll("section[data-day]").forEach(s=>s.hidden = s.dataset.day!==dayId);
  document.body.dataset.day = dayId;
  markNow();
}
function defaultDay(){ const t=new Date(); const iso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; return iso===DAYS.domingo.date ? "domingo" : "sabado"; }

function markNow(){
  const t=new Date(); const iso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  const mins=t.getHours()*60+t.getMinutes();
  document.querySelectorAll(".stop.now").forEach(e=>e.classList.remove("now"));
  for(const id of Object.keys(DAYS)){
    if(DAYS[id].date!==iso) continue;
    const items=[...document.querySelectorAll(`#day-${id} .stop`)];
    const toM = s=>{const [h,m]=s.split(":").map(Number); return h*60+m;};
    let cur=null; items.forEach(li=>{ if(toM(li.dataset.t)<=mins) cur=li; });
    if(cur) cur.classList.add("now");
  }
}

Object.keys(DAYS).forEach(render);
document.addEventListener("change", e=>{
  const cb=e.target.closest('input[type="checkbox"][data-id]'); if(!cb) return;
  done[cb.dataset.id]=cb.checked; if(!cb.checked) delete done[cb.dataset.id]; store.set(doneKey,done);
  cb.closest(".stop").classList.toggle("done", cb.checked);
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ location.hash=b.dataset.day; show(b.dataset.day); window.scrollTo({top:0}); }));
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
setInterval(markNow, 60000);
</script>
</body>
</html>
